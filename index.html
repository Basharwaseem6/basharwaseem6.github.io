<style>
  :root{
    --bg:#F7F4EE; --card:#FFFFFF; --ink:#1C1A17; --muted:#6F685E; --line:#E6E0D5;
    --gold:#A8812F; --gold-soft:#F4ECDB; --err:#B3261E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center;padding:28px 16px 40px}
  .wrap{width:100%;max-width:520px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--muted);font-size:13px;font-weight:500}
  .brand .dot{width:28px;height:28px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#fff;font-size:14px}
  .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:26px}
  .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .35s ease}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
  .step{display:none;animation:in .3s ease}
  .step.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:22px;line-height:1.4;font-weight:700;margin-bottom:6px}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:6px}
  label.l,.q{display:block;font-size:14px;font-weight:600;margin:20px 0 8px;line-height:1.5}
  label.l small{font-weight:400;color:var(--muted)}
  .grp{font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.02em;margin:20px 0 8px}
  input[type=text],input[type=tel],input[type=url],select{
    width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s}
  input:focus,select:focus{border-color:var(--gold)}
  .phone{display:flex;gap:8px;direction:ltr}
  .phone select{width:120px;flex:none}
  .phone input{flex:1;min-width:0}
  .opts{display:grid;gap:8px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.list{gap:10px;margin-top:16px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;font:inherit;font-size:15px;font-weight:500;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:#CDBF9F}
  .opt.sel{border-color:var(--gold);background:var(--gold-soft)}
  .opt .ic{font-size:18px;width:22px;text-align:center;flex:none}
  .opt .tx{flex:1;line-height:1.4}
  .opt .bx{width:20px;height:20px;border:1.5px solid #C9C1B2;border-radius:6px;flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
  .opt.sel .bx{background:var(--gold);border-color:var(--gold)}
  .opt.sel .bx::after{content:"✓"}
  .fld{padding:11px 10px;font-size:13.5px;gap:8px;min-height:58px}
  .wide{grid-column:1/-1}
  .lang{justify-content:center;text-align:center;padding:18px 12px;font-size:17px;font-weight:600}
  .lang small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:3px}
  .lp{text-align:center}
  .foot div+div{margin-top:4px}
  .lp h1 span,.lp .sub span{display:block}
  .lp .sub{margin-bottom:22px}
  .lp .sub span+span{margin-top:4px}
  .chip{justify-content:center;padding:11px 8px;font-size:14px;text-align:center}
  .otherBox{display:none;margin-top:10px}
  .otherBox.on{display:block}
  .nav{display:flex;gap:10px;margin-top:26px}
  .btn{flex:1;font:inherit;font-size:16px;font-weight:600;border:none;border-radius:12px;padding:14px;cursor:pointer;background:var(--ink);color:#fff;transition:opacity .2s}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.ghost{flex:none;background:transparent;color:var(--muted);border:1.5px solid var(--line);padding:14px 18px}
  .err{color:var(--err);font-size:13px;margin-top:8px;min-height:18px}
  input.hp{position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);opacity:0;pointer-events:none}
  .done{text-align:center;padding:12px 0}
  .done .big{width:64px;height:64px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:30px;margin:0 auto 18px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.6}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:360px){.opts.two.fields{grid-template-columns:1fr}}
</style>
</head>

<div class="wrap">
  <div class="brand"><span class="dot">★</span><span id="brandTx"></span></div>
  <div class="bar"><i id="bar"></i></div>

  <div class="card">
    <!-- 0: language -->
    <section class="step on lp" data-step="0">
      <h1><span dir="ltr" lang="en">Choose your language</span><span dir="rtl" lang="ar">اختر لغتك</span></h1>
      <p class="sub"><span dir="ltr" lang="en">Check if you qualify for the UAE Golden Visa. It takes about 2 minutes.</span><span dir="rtl" lang="ar">تحقق إذا كنت مؤهل للإقامة الذهبية في الإمارات، بياخد دقيقتين تقريباً.</span></p>
      <div class="opts two">
        <button class="opt lang" type="button" lang="en" dir="ltr" onclick="setLang('en')"><span class="tx">English<small>Continue in English</small></span></button>
        <button class="opt lang" type="button" lang="ar" dir="rtl" onclick="setLang('ar')"><span class="tx">العربية<small>أكمل بالعربية</small></span></button>
      </div>
    </section>

    <!-- 1: field -->
    <section class="step" data-step="1">
      <h1 data-t="fieldH"></h1>
      <p class="sub" data-t="fieldP"></p>
      <div id="fieldBox"></div>
      <div class="otherBox" id="otherBox">
        <label class="l" for="otherText" data-t="otherQ"></label>
        <input id="otherText" type="text" maxlength="120" oninput="check()">
      </div>
      <div class="nav"><button class="btn ghost" type="button" onclick="go(-1)" data-t="back"></button><button class="btn" id="next1" type="button" onclick="go(1)" data-t="next" disabled></button></div>
    </section>

    <!-- 2: details for the chosen field -->
    <section class="step" data-step="2">
      <h1 id="detH"></h1>
      <p class="sub" data-t="detP"></p>
      <div id="detailBox"></div>
      <div class="nav"><button class="btn ghost" type="button" onclick="go(-1)" data-t="back"></button><button class="btn" id="next2" type="button" onclick="go(1)" data-t="next" disabled></button></div>
    </section>

    <!-- 3: proofs (multi-select) -->
    <section class="step" data-step="3">
      <h1 data-t="proofH"></h1>
      <p class="sub" data-t="proofP"></p>
      <div id="proofBox"></div>
      <div id="linkWrap">
        <label class="l" for="link"><span id="linkLabel"></span> <small data-t="optional"></small></label>
        <input id="link" type="url" inputmode="url" maxlength="300" placeholder="instagram.com/… · youtube.com/… · linkedin.com/…" style="direction:ltr">
      </div>
      <div class="nav"><button class="btn ghost" type="button" onclick="go(-1)" data-t="back"></button><button class="btn" id="next3" type="button" onclick="go(1)" data-t="next" disabled></button></div>
    </section>

    <!-- 4: contact + submit -->
    <section class="step" data-step="4">
      <h1 data-t="contactH"></h1>
      <p class="sub" data-t="contactP"></p>
      <label class="l" for="name" data-t="name"></label>
      <input id="name" type="text" autocomplete="name" maxlength="100" oninput="check()">
      <label class="l" for="phone" data-t="phone"></label>
      <div class="phone">
        <select id="code" onchange="check()"></select>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="20" placeholder="50 123 4567" oninput="check()">
      </div>
      <input class="hp" id="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="err" id="err4"></div>
      <div class="nav"><button class="btn ghost" type="button" onclick="go(-1)" data-t="back"></button><button class="btn" id="send" type="button" onclick="send()" disabled><span data-t="send"></span></button></div>
    </section>

    <!-- 5: done -->
    <section class="step" data-step="5">
      <div class="done">
        <div class="big">✓</div>
        <h1 data-t="doneH"></h1>
        <p class="sub" data-t="doneP"></p>
      </div>
    </section>
  </div>
  <p class="foot" id="foot"></p>
</div>

      gpa:['معدلك الجامعي',{gpa38:'3.8 أو أعلى',gpa35:'من 3.5 لـ 3.8',gpalt:'أقل من 3.5'}],
      grad:['متى تخرجت؟',{recent:'خلال آخر سنتين',older:'من أكتر من سنتين',studying:'لسا عم أدرس'}],

      residence:['وين ساكن حالياً؟',{dubai:'الإمارات – دبي',abudhabi:'الإمارات – أبوظبي',other_emirate:'الإمارات – إمارة تانية',outside:'خارج الإمارات'}]
    },
    proofH:'شو عندك إثبات عليه؟', proofP:'علّم على كل الأوراق يلي عندك أو فيك تجيبها. فيك تختار أكتر من خيار.',
    proofs:{award_cert:'شهادات الجوائز أو الترشيحات',event_docs:'دعوات أو بوسترات أو برامج المهرجانات والفعاليات',
      press:'تغطية إعلامية (مقالات، مقابلات، تلفزيون)',membership:'بطاقة أو رسالة عضوية بنقابة أو جمعية',
      published:'أعمال منشورة (Spotify، YouTube، كتب، كتالوجات)',recommend:'رسائل توصية من جهات أو أشخاص معروفين',
      brand_contracts:'عقود أو فواتير تعاون مع علامات تجارية',analytics:'لقطات إحصائيات الحساب (Insights)',
      media_licence:'رخصة إعلامية أو رخصة تجارية للمحتوى',medal_cert:'شهادات الميداليات والبطولات',
      fed_letter:'رسالة من الاتحاد الرياضي',natteam_letter:'رسالة استدعاء أو مشاركة مع المنتخب',
      ranking:'تصنيف رسمي (وطني أو دولي)',contract:'عقد عمل من وزارة الموارد البشرية',salary_cert:'شهادة راتب',
      bank6:'كشف حساب بنكي آخر 6 أشهر',degree_cert:'شهادة جامعية مصدّقة',license_doc:'ترخيص مزاولة المهنة',
      trade_licence:'رخصة تجارية',audited:'بيانات مالية مدققة',title_deed:'سند ملكية العقار',
      certificate:'الشهادة الدراسية',transcript:'كشف العلامات',equivalency:'معادلة من وزارة التعليم العالي',
      school_rec:'توصية من المدرسة أو الجامعة',none:'لسا ما عندي شي'},
    linkL:{creative:'رابط لأعمالك',creator:'رابط حسابك الأساسي',sports:'رابط عن إنجازاتك',other:'رابط لشغلك أو حسابك'},
    contactH:'آخر خطوة', contactP:'وين منتواصل معك؟ رح نراجع إجاباتك ونحكيك على واتساب.',
    name:'الاسم الكامل', phone:'رقم الواتساب',
    doneH:'شكراً إلك!', doneP:'وصلتنا معلوماتك، ورح نتواصل معك على واتساب قريباً.',
    foot:'إجاباتك بتُستخدم فقط لتقييم أهليتك. الموافقة النهائية بتكون من الجهات الرسمية في الإمارات.',
    eName:'اكتب اسمك لو سمحت.', ePhone:'اكتب رقم واتساب صحيح.', eSend:'صار خطأ، جرّب مرة تانية.'
  }
};
const CODES = [['971','🇦🇪'],['962','🇯🇴'],['963','🇸🇾'],['961','🇱🇧'],['970','🇵🇸'],['20','🇪🇬'],['966','🇸🇦'],['964','🇮🇶'],['965','🇰🇼'],['974','🇶🇦'],['973','🇧🇭'],['968','🇴🇲'],['967','🇾🇪'],['249','🇸🇩'],['218','🇱🇾'],['216','🇹🇳'],['213','🇩🇿'],['212','🇲🇦'],['90','🇹🇷'],['98','🇮🇷'],['91','🇮🇳'],['92','🇵🇰'],['63','🇵🇭'],['44','🇬🇧'],['33','🇫🇷'],['49','🇩🇪'],['7','🇷🇺'],['1','🇺🇸']];

/* ===== State + helpers ===== */
const S = {lang:'ar', step:0, field:'', ans:{}, proofs:[]};
const $ = id => document.getElementById(id);
const route = () => ROUTE[S.field] || 'other';
const t = () => T[S.lang];

function visibleQs(){
  return ROUTES[route()].qs.filter(q =>
    (!q.only || q.only.includes(S.field)) && (!q.showIf || S.ans[q.showIf[0]] === q.showIf[1]));
}
function btn(attrs, inner, sel, cls){
  return `<button type="button" class="opt${sel?' sel':''}${cls?' '+cls:''}" ${attrs} onclick="pick(this)">${inner}</button>`;
}

/* ===== Rendering ===== */
const NEUTRAL = {brand:'UAE Golden Visa · الإقامة الذهبية',
  foot:['Your answers are used only to assess your eligibility. Final approval is decided by UAE authorities.',
        'إجاباتك بتُستخدم فقط لتقييم أهليتك. الموافقة النهائية بتكون من الجهات الرسمية في الإمارات.']};

// Header and footer: both languages on the language page, chosen language after it
function chrome(){
  const f = $('foot');
  if (S.step === 0){
    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    $('brandTx').textContent = NEUTRAL.brand;
    f.innerHTML = '';
    NEUTRAL.foot.forEach((txt,i) => { const d = document.createElement('div'); d.textContent = txt; d.dir = i ? 'rtl' : 'ltr'; d.lang = i ? 'ar' : 'en'; f.appendChild(d); });
  } else {
    document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    $('brandTx').textContent = t().brand;
    f.textContent = t().foot;
  }
}

function setLang(l, stay){
  S.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => { const v = t()[e.dataset.t]; if (typeof v === 'string') e.textContent = v; });
  const code = $('code'), keep = code.value;
  code.innerHTML = CODES.map(([c,f]) => `<option value="${c}">${f} +${c}</option>`).join('') + `<option value="">${t().other} (+…)</option>`;
  code.value = keep || '971';
  renderFields(); renderDetails(); renderProofs();
  if (!stay) go(1); else chrome();
}

function renderFields(){
  let h = '';
  GROUPS.forEach(g => {
    h += `<div class="grp">${t().groups[g.k]}</div><div class="opts two fields">`;
    g.items.forEach((k,i) => {
      const lastOdd = g.items.length % 2 === 1 && i === g.items.length - 1;
      h += btn(`data-g="field" data-k="${k}"`, `<span class="ic">${ICONS[k]}</span><span class="tx">${t().fields[k]}</span>`, S.field===k, 'fld' + (lastOdd?' wide':''));
    });
    h += `</div>`;
  });
  h += `<div class="grp">${t().other}</div><div class="opts">` +
       btn(`data-g="field" data-k="other"`, `<span class="ic">${ICONS.other}</span><span class="tx">${t().fields.other}</span>`, S.field==='other', 'fld') + `</div>`;
  $('fieldBox').innerHTML = h;
  $('otherBox').classList.toggle('on', S.field === 'other');
}

function renderDetails(){
  if (!S.field) return;
  $('detH').textContent = t().detH[route()];
  let h = '';
  visibleQs().forEach(q => {
    const [label, choices] = t().q[q.k];
    const keys = QDEF[q.k];
    const cols = keys.length === 3 && keys.every(k => choices[k].length < 9) ? 'two' : (keys.length === 3 ? '' : 'two');
    h += `<div class="q">${label}</div><div class="opts ${cols}">`;
    keys.forEach((v,i) => {
      const wide = cols === 'two' && keys.length % 2 === 1 && i === keys.length - 1 ? ' wide' : '';
      h += btn(`data-g="q" data-q="${q.k}" data-k="${v}"`, `<span class="tx">${choices[v]}</span>`, S.ans[q.k]===v, 'chip' + wide);
    });
    h += `</div>`;
  });
  $('detailBox').innerHTML = h;
}

function renderProofs(){
  if (!S.field) return;
  const r = ROUTES[route()];
  let h = `<div class="opts list">`;
  [...r.proofs, 'none'].forEach(k => {
    h += btn(`data-g="proof" data-k="${k}"`, `<span class="tx">${t().proofs[k]}</span><span class="bx"></span>`, S.proofs.includes(k));
  });
  $('proofBox').innerHTML = h + `</div>`;
  $('linkWrap').style.display = r.link ? '' : 'none';
  $('linkLabel').textContent = r.link ? t().linkL[r.link] : '';
}

/* ===== Interaction ===== */
function pick(el){
  const g = el.dataset.g, k = el.dataset.k;
  if (g === 'field'){
    if (S.field !== k){ S.ans = {}; S.proofs = []; }
    S.field = k;
    renderFields(); renderDetails(); renderProofs(); check();
    if (k === 'other') setTimeout(() => $('otherText').focus(), 50);
    else setTimeout(() => go(1), 220);
    return;
  }
  if (g === 'q'){ S.ans[el.dataset.q] = k; renderDetails(); }
  if (g === 'proof'){
    if (k === 'none') S.proofs = S.proofs.includes('none') ? [] : ['none'];
    else {
      S.proofs = S.proofs.filter(x => x !== 'none');
      S.proofs = S.proofs.includes(k) ? S.proofs.filter(x => x !== k) : [...S.proofs, k];
    }
    renderProofs();
  }
  check();
}

function phoneDigits(){
  let p = $('phone').value.replace(/\D/g,''), c = $('code').value;
  if (c) p = p.replace(/^0+/,'');
  return c + p;
}

function check(){
  $('next1').disabled = !S.field || (S.field === 'other' && !$('otherText').value.trim());
  $('next2').disabled = !S.field || !visibleQs().every(q => S.ans[q.k]);
  $('next3').disabled = S.proofs.length === 0;
  const d = phoneDigits().length;
  $('send').disabled = !($('name').value.trim() && d >= 8 && d <= 15);
}

function go(dir){
  if (dir > 0 && S.step >= 1 && S.step <= 3 && $('next' + S.step).disabled) return;
  S.step = Math.max(0, Math.min(5, S.step + dir));
  document.querySelectorAll('.step').forEach(s => s.classList.toggle('on', +s.dataset.step === S.step));
  $('bar').style.width = (S.step / 5 * 100) + '%';
  chrome();
  check();
  window.scrollTo({top:0, behavior:'smooth'});
  if (S.step === 4) setTimeout(() => $('name').focus(), 60);
}

function send(){
  const b = $('send');
  if (!$('name').value.trim()) { $('err4').textContent = t().eName; return; }
  const d = phoneDigits().length;
  if (d < 8 || d > 15) { $('err4').textContent = t().ePhone; return; }
  $('err4').textContent = '';
  b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  const ans = {}; visibleQs().forEach(q => ans[q.k] = S.ans[q.k]);
  const data = {
    lang:S.lang, field:S.field, otherText: S.field === 'other' ? $('otherText').value.trim() : '',
    ans:ans, proofs:S.proofs.filter(x => x !== 'none'), link: ROUTES[route()].link ? $('link').value.trim() : '',
    name:$('name').value.trim(), code:$('code').value, phone:$('phone').value, website:$('website').value
  };
  const fail = () => { b.disabled = false; b.textContent = t().send; $('err4').textContent = t().eSend; };
  // Sent without Google cookies, so it works for visitors signed in to several Google accounts
  fetch(ENDPOINT, {method:'POST', credentials:'omit', redirect:'follow',
                   headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data)})
    .then(r => r.json())
    .then(res => res && res.ok ? go(1) : fail())
    .catch(fail);
}

setLang('en', true);
</script>
